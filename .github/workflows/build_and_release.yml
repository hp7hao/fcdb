          Pyxel game database from User Examples.

          **Download:** `https://github.com/hp7hao/fcdb/releases/download/pyxel-latest/fcdb_pyxel.zip`

          Updated: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
        make_latest: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
