name: Build and Release FCDB

env:
  FCDBTOOL_REVISION: ${{ vars.FCDBTOOL_REVISION }}
  FCDB_LATEST_SCHEMA: 'unversioned'

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.md'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build (comma-separated, or "all")'
        required: false
        default: 'all'

jobs:
  # Detect which platforms have source changes
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      pico8: ${{ steps.check.outputs.pico8 }}
      pyxel: ${{ steps.check.outputs.pyxel }}
      pyxelpico: ${{ steps.check.outputs.pyxelpico }}
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 2

    - name: Test stable-channel promotion gate
      run: |
        python3 .github/scripts/test_check_promotion.py
        python3 .github/scripts/test_preserve_stable_contract.py

    - name: Detect changed platforms
      id: check
      run: |
        # On dispatch, build all (or specified) platforms
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          PLATFORMS="${{ github.event.inputs.platforms || 'all' }}"
          if [ "$PLATFORMS" = "all" ]; then
            echo "pico8=true" >> $GITHUB_OUTPUT
            echo "pyxel=true" >> $GITHUB_OUTPUT
            echo "pyxelpico=true" >> $GITHUB_OUTPUT
          else
            echo "pico8=false" >> $GITHUB_OUTPUT
            echo "pyxel=false" >> $GITHUB_OUTPUT
            echo "pyxelpico=false" >> $GITHUB_OUTPUT
            if echo "$PLATFORMS" | grep -q "pico8"; then echo "pico8=true" >> $GITHUB_OUTPUT; fi
            if echo "$PLATFORMS" | grep -q "pyxel"; then echo "pyxel=true" >> $GITHUB_OUTPUT; fi
            if echo "$PLATFORMS" | grep -q "pyxelpico"; then echo "pyxelpico=true" >> $GITHUB_OUTPUT; fi
          fi
          exit 0
        fi

        # On push, detect which platform directories changed
        CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")

        PICO8=false
        PYXEL=false
        PYXELPICO=false

        if echo "$CHANGED" | grep -qE "^(platforms/pico8)"; then
          PICO8=true
        fi
        if echo "$CHANGED" | grep -qE "^(platforms/pyxel)"; then
          PYXEL=true
        fi
        if echo "$CHANGED" | grep -qE "^(platforms/pyxelpico)"; then
          PYXELPICO=true
        fi

        # If workflow file changed, rebuild all
        if echo "$CHANGED" | grep -q "build_and_release.yml"; then
          PICO8=true
          PYXEL=true
          PYXELPICO=true
        fi

        echo "pico8=$PICO8" >> $GITHUB_OUTPUT
        echo "pyxel=$PYXEL" >> $GITHUB_OUTPUT
        echo "pyxelpico=$PYXELPICO" >> $GITHUB_OUTPUT

  # Build and release PICO-8
  release-pico8:
    needs: detect-changes
    if: needs.detect-changes.outputs.pico8 == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout FCDB Data
      uses: actions/checkout@v3
      with:
        path: fcdb

    - name: Checkout FCDB Tool
      env:
        REVISION: ${{ env.FCDBTOOL_REVISION }}
      run: test "${#REVISION}" -eq 40 && ! printf '%s' "$REVISION" | grep -q '[^0-9a-fA-F]'

    - name: Checkout pinned FCDB Tool
      uses: actions/checkout@v3
      with:
        repository: hp7hao/fcdbtool
        ref: ${{ env.FCDBTOOL_REVISION }}
        path: fcdbtool
        token: ${{ secrets.FCDBTOOL }}

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install & Build Tool
      run: cd fcdbtool && npm install && npm run build

    - name: Validate & Package PICO-8
      env:
        FCDB_SOURCE_REVISION: ${{ github.sha }}
        FCDB_PRODUCER_REVISION: ${{ env.FCDBTOOL_REVISION }}
      run: |
        cd fcdbtool
        node out/cli.js release pico8 --data-dir ../fcdb

    - name: Read PICO-8 candidate schema
      id: candidate
      run: |
        schema=$(unzip -p fcdb/releases/fcdb_pico8.zip version.json | python3 -c 'import json, sys; print(json.load(sys.stdin)["schema_version"])')
        echo "schema=$schema" >> "$GITHUB_OUTPUT"

    - name: Validate PICO-8 candidate without publication
      if: steps.candidate.outputs.schema != env.FCDB_LATEST_SCHEMA
      run: |
        python3 fcdb/.github/scripts/check_promotion.py \
          --platform pico8 \
          --candidate-schema "${{ steps.candidate.outputs.schema }}" \
          --latest-schema "$FCDB_LATEST_SCHEMA" \
          --candidate-only

    - name: Guard PICO-8 stable promotion
      if: steps.candidate.outputs.schema == env.FCDB_LATEST_SCHEMA
      run: |
        python3 fcdb/.github/scripts/check_promotion.py \
          --platform pico8 \
          --candidate-schema "${{ steps.candidate.outputs.schema }}" \
          --latest-schema "$FCDB_LATEST_SCHEMA"

    - name: Preserve displaced PICO-8 latest package
      if: steps.candidate.outputs.schema == env.FCDB_LATEST_SCHEMA
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python3 fcdb/.github/scripts/preserve_stable_contract.py \
          --platform pico8 \
          --candidate-schema "${{ steps.candidate.outputs.schema }}" \
          --asset fcdb_pico8.zip \
          --repository "${{ github.repository }}"

    - name: Release PICO-8 schema channel
      if: steps.candidate.outputs.schema == env.FCDB_LATEST_SCHEMA
      uses: softprops/action-gh-release@v1
      with:
        tag_name: pico8-schema-${{ steps.candidate.outputs.schema }}
        name: "PICO-8 Database (schema ${{ steps.candidate.outputs.schema }})"
        files: fcdb/releases/fcdb_pico8.zip
        make_latest: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Release PICO-8
      if: steps.candidate.outputs.schema == env.FCDB_LATEST_SCHEMA
      uses: softprops/action-gh-release@v1
      with:
        tag_name: pico8-latest
        name: "PICO-8 Database"
        files: fcdb/releases/fcdb_pico8.zip
        body: |
          PICO-8 game database from Lexaloffle BBS.

          **Download:** `https://github.com/hp7hao/fcdb/releases/download/pico8-latest/fcdb_pico8.zip`

          Updated: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
        make_latest: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build and release PyxelPico
  release-pyxelpico:
    needs: detect-changes
    if: needs.detect-changes.outputs.pyxelpico == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout FCDB Data
      uses: actions/checkout@v3
      with:
        path: fcdb

    - name: Checkout FCDB Tool
      env:
        REVISION: ${{ env.FCDBTOOL_REVISION }}
      run: test "${#REVISION}" -eq 40 && ! printf '%s' "$REVISION" | grep -q '[^0-9a-fA-F]'

    - name: Checkout pinned FCDB Tool
      uses: actions/checkout@v3
      with:
        repository: hp7hao/fcdbtool
        ref: ${{ env.FCDBTOOL_REVISION }}
        path: fcdbtool
        token: ${{ secrets.FCDBTOOL }}

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install & Build Tool
      run: cd fcdbtool && npm install && npm run build

    - name: Validate & Package PyxelPico
      env:
        FCDB_SOURCE_REVISION: ${{ github.sha }}
        FCDB_PRODUCER_REVISION: ${{ env.FCDBTOOL_REVISION }}
      run: |
        cd fcdbtool
        node out/cli.js release pyxelpico --data-dir ../fcdb

    - name: Read PyxelPico candidate schema
      id: candidate
      run: |
        schema=$(unzip -p fcdb/releases/fcdb_pyxelpico.zip version.json | python3 -c 'import json, sys; print(json.load(sys.stdin)["schema_version"])')
        echo "schema=$schema" >> "$GITHUB_OUTPUT"

    - name: Validate PyxelPico candidate without publication
      if: steps.candidate.outputs.schema != env.FCDB_LATEST_SCHEMA
      run: |
        python3 fcdb/.github/scripts/check_promotion.py \
          --platform pyxelpico \
          --candidate-schema "${{ steps.candidate.outputs.schema }}" \
          --latest-schema "$FCDB_LATEST_SCHEMA" \
          --candidate-only

    - name: Guard PyxelPico stable promotion
      if: steps.candidate.outputs.schema == env.FCDB_LATEST_SCHEMA
      run: |
        python3 fcdb/.github/scripts/check_promotion.py \
          --platform pyxelpico \
          --candidate-schema "${{ steps.candidate.outputs.schema }}" \
          --latest-schema "$FCDB_LATEST_SCHEMA"

    - name: Preserve displaced PyxelPico latest package
      if: steps.candidate.outputs.schema == env.FCDB_LATEST_SCHEMA
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python3 fcdb/.github/scripts/preserve_stable_contract.py \
          --platform pyxelpico \
          --candidate-schema "${{ steps.candidate.outputs.schema }}" \
          --asset fcdb_pyxelpico.zip \
          --asset fcdb_runtime_pyxelpico_web.zip \
          --repository "${{ github.repository }}"

    - name: Release PyxelPico schema channel
      if: steps.candidate.outputs.schema == env.FCDB_LATEST_SCHEMA
      uses: softprops/action-gh-release@v1
      with:
        tag_name: pyxelpico-schema-${{ steps.candidate.outputs.schema }}
        name: "PyxelPico Database (schema ${{ steps.candidate.outputs.schema }})"
        files: |
          fcdb/releases/fcdb_pyxelpico.zip
          fcdb/releases/fcdb_runtime_pyxelpico_web.zip
        make_latest: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Release PyxelPico
      if: steps.candidate.outputs.schema == env.FCDB_LATEST_SCHEMA
      uses: softprops/action-gh-release@v1
      with:
        tag_name: pyxelpico-latest
        name: "PyxelPico Database"
        files: |
          fcdb/releases/fcdb_pyxelpico.zip
          fcdb/releases/fcdb_runtime_pyxelpico_web.zip
        body: |
          PyxelPico fantasy console game database.

          **Download:** `https://github.com/hp7hao/fcdb/releases/download/pyxelpico-latest/fcdb_pyxelpico.zip`
          **Web Runtime:** `https://github.com/hp7hao/fcdb/releases/download/pyxelpico-latest/fcdb_runtime_pyxelpico_web.zip`

          Updated: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
        make_latest: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build and release Pyxel
  release-pyxel:
    needs: detect-changes
    if: needs.detect-changes.outputs.pyxel == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout FCDB Data
      uses: actions/checkout@v3
      with:
        path: fcdb

    - name: Checkout FCDB Tool
      env:
        REVISION: ${{ env.FCDBTOOL_REVISION }}
      run: test "${#REVISION}" -eq 40 && ! printf '%s' "$REVISION" | grep -q '[^0-9a-fA-F]'

    - name: Checkout pinned FCDB Tool
      uses: actions/checkout@v3
      with:
        repository: hp7hao/fcdbtool
        ref: ${{ env.FCDBTOOL_REVISION }}
        path: fcdbtool
        token: ${{ secrets.FCDBTOOL }}

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install & Build Tool
      run: cd fcdbtool && npm install && npm run build

    - name: Validate & Package Pyxel
      env:
        FCDB_SOURCE_REVISION: ${{ github.sha }}
        FCDB_PRODUCER_REVISION: ${{ env.FCDBTOOL_REVISION }}
      run: |
        cd fcdbtool
        node out/cli.js release pyxel --data-dir ../fcdb

    - name: Read Pyxel candidate schema
      id: candidate
      run: |
        schema=$(unzip -p fcdb/releases/fcdb_pyxel.zip version.json | python3 -c 'import json, sys; print(json.load(sys.stdin)["schema_version"])')
        echo "schema=$schema" >> "$GITHUB_OUTPUT"

    - name: Validate Pyxel candidate without publication
      if: steps.candidate.outputs.schema != env.FCDB_LATEST_SCHEMA
      run: |
        python3 fcdb/.github/scripts/check_promotion.py \
          --platform pyxel \
          --candidate-schema "${{ steps.candidate.outputs.schema }}" \
          --latest-schema "$FCDB_LATEST_SCHEMA" \
          --candidate-only

    - name: Guard Pyxel stable promotion
      if: steps.candidate.outputs.schema == env.FCDB_LATEST_SCHEMA
      run: |
        python3 fcdb/.github/scripts/check_promotion.py \
          --platform pyxel \
          --candidate-schema "${{ steps.candidate.outputs.schema }}" \
          --latest-schema "$FCDB_LATEST_SCHEMA"

    - name: Preserve displaced Pyxel latest package
      if: steps.candidate.outputs.schema == env.FCDB_LATEST_SCHEMA
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python3 fcdb/.github/scripts/preserve_stable_contract.py \
          --platform pyxel \
          --candidate-schema "${{ steps.candidate.outputs.schema }}" \
          --asset fcdb_pyxel.zip \
          --repository "${{ github.repository }}"

    - name: Release Pyxel schema channel
      if: steps.candidate.outputs.schema == env.FCDB_LATEST_SCHEMA
      uses: softprops/action-gh-release@v1
      with:
