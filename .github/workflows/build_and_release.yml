name: Build and Release FCDB

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.md'
  schedule:
    # Run every Sunday at midnight (keeps data fresh)
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build (comma-separated, or "all")'
        required: false
        default: 'all'

jobs:
  # Detect which platforms have source changes
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      pico8: ${{ steps.check.outputs.pico8 }}
      pyxel: ${{ steps.check.outputs.pyxel }}
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 2

    - name: Detect changed platforms
      id: check
      run: |
        # On schedule/dispatch, build all (or specified) platforms
        if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          PLATFORMS="${{ github.event.inputs.platforms || 'all' }}"
          if [ "$PLATFORMS" = "all" ]; then
            echo "pico8=true" >> $GITHUB_OUTPUT
            echo "pyxel=true" >> $GITHUB_OUTPUT
          else
            echo "pico8=false" >> $GITHUB_OUTPUT
            echo "pyxel=false" >> $GITHUB_OUTPUT
            if echo "$PLATFORMS" | grep -q "pico8"; then echo "pico8=true" >> $GITHUB_OUTPUT; fi
            if echo "$PLATFORMS" | grep -q "pyxel"; then echo "pyxel=true" >> $GITHUB_OUTPUT; fi
          fi
          exit 0
        fi

        # On push, detect which platform directories changed
        CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")

        PICO8=false
        PYXEL=false

        if echo "$CHANGED" | grep -qE "^(sources/pico8|platforms/pico8|curated/pico8|i18n/.*/pico8)"; then
          PICO8=true
        fi
        if echo "$CHANGED" | grep -qE "^(sources/pyxel|platforms/pyxel|curated/pyxel|i18n/.*/pyxel)"; then
          PYXEL=true
        fi

        # If workflow file changed, rebuild all
        if echo "$CHANGED" | grep -q "build_and_release.yml"; then
          PICO8=true
          PYXEL=true
        fi

        echo "pico8=$PICO8" >> $GITHUB_OUTPUT
        echo "pyxel=$PYXEL" >> $GITHUB_OUTPUT

  # Build and release PICO-8
  release-pico8:
    needs: detect-changes
    if: needs.detect-changes.outputs.pico8 == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout FCDB Data
      uses: actions/checkout@v3
      with:
        path: fcdb

    - name: Checkout FCDB Tool
      uses: actions/checkout@v3
      with:
        repository: hp7hao/fcdbtool
        ref: main
        path: fcdbtool
        token: ${{ secrets.FCDBTOOL }}

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install & Build Tool
      run: cd fcdbtool && npm install && npm run build

    - name: Build & Pack PICO-8
      run: |
        cd fcdbtool
        node out/cli.js build pico8 --data-dir ../fcdb
        node out/cli.js pack pico8 --data-dir ../fcdb

    - name: Release PICO-8
      uses: softprops/action-gh-release@v1
      with:
        tag_name: pico8-latest
        name: "PICO-8 Database"
        files: fcdb/releases/fcdb_pico8.zip
        body: |
          PICO-8 game database from Lexaloffle BBS.

          **Download:** `https://github.com/hp7hao/fcdb/releases/download/pico8-latest/fcdb_pico8.zip`

          Updated: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
        make_latest: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build and release Pyxel
  release-pyxel:
    needs: detect-changes
    if: needs.detect-changes.outputs.pyxel == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout FCDB Data
      uses: actions/checkout@v3
      with:
        path: fcdb

    - name: Checkout FCDB Tool
      uses: actions/checkout@v3
      with:
        repository: hp7hao/fcdbtool
        ref: main
        path: fcdbtool
        token: ${{ secrets.FCDBTOOL }}

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install & Build Tool
      run: cd fcdbtool && npm install && npm run build

    - name: Build & Pack Pyxel
      run: |
        cd fcdbtool
        node out/cli.js build pyxel --data-dir ../fcdb
        node out/cli.js pack pyxel --data-dir ../fcdb

    - name: Release Pyxel
      uses: softprops/action-gh-release@v1
      with:
        tag_name: pyxel-latest
        name: "Pyxel Database"
        files: fcdb/releases/fcdb_pyxel.zip
        body: |
          Pyxel game database from User Examples.

          **Download:** `https://github.com/hp7hao/fcdb/releases/download/pyxel-latest/fcdb_pyxel.zip`

          Updated: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
        make_latest: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
